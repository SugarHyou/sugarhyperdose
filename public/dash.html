<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ADMIN PANEL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/gif" href="assets/graphics/favicons/x.gif">
    <style>
        .dash-container {
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .window-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
        }

        .section-box {
            padding: 10px;
            background: #f9f9f9;
        }

        label {
            display: block;
            font-weight: 900;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }

        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #ff0055;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        button {
            cursor: pointer;
            border: 2px outset #fff;
            background: #eee;
            font-weight: bold;
            padding: 8px;
        }

        button:hover {
            background: #ddd;
        }

        input[type="text"],
        select,
        input[type="file"],
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 8px;
            border: 2px solid #000;
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        #submit-btn {
            background: blueviolet;
            color: white;
            font-weight: 900;
            padding: 10px;
            cursor: pointer;
        }

        .widget-section {
            border-left: 4px solid blueviolet;
            padding-left: 8px;
            margin-top: 8px;
        }
    </style>
</head>

<body class="flex justify-center align-center" onload="initAdminPanel()">

    <div class="window dash-container">
        <div class="window-title">admin.exe</div>
        <div class="window-body">

            <div class="section-box">
                <label style="color: red;">STRESS</label>
                <div class="slider-wrap">
                    <input type="range" id="stat-stress" min="0" max="100" value="20"
                        oninput="document.getElementById('val-stress').innerText = this.value + '%'">
                    <span id="val-stress">20%</span>
                </div>
            </div>

            <div class="section-box">
                <label style="color: hotpink;">AFFECTION</label>
                <div class="slider-wrap">
                    <input type="range" id="stat-affection" min="0" max="100" value="50"
                        oninput="document.getElementById('val-affection').innerText = this.value + '%'">
                    <span id="val-affection">50%</span>
                </div>
            </div>

            <div class="section-box">
                <div class="widget-section">
                    <label>🎨 LATEST ART</label>
                    <input type="text" id="art-title" placeholder="Art Title...">
                    <label style="font-size: 0.7rem; color: #555; margin-bottom: 2px;">Select Existing Asset or Upload
                        New:</label>
                    <select id="art-select" class="art-dropdown">
                        <option value="">-- Load from existing assets --</option>
                    </select>
                    <input type="file" id="art-file-upload" accept="image/*">
                    <input type="text" id="art-desc" placeholder="Art Short Description...">
                </div>

                <div class="widget-section" style="border-left-color: dodgerblue;">
                    <label>🎮 PLAYING</label>
                    <input type="text" id="play-title" placeholder="Game Name...">
                    <select id="play-select" class="art-dropdown">
                        <option value="">-- Load from existing assets --</option>
                    </select>
                    <input type="file" id="play-file-upload" accept="image/*">
                    <input type="text" id="play-desc" placeholder="Status (e.g. Grinding levels)...">
                </div>

                <div class="widget-section" style="border-left-color: limegreen;">
                    <label>📺 WATCHING</label>
                    <input type="text" id="watch-title" placeholder="Show Name...">
                    <select id="watch-select" class="art-dropdown">
                        <option value="">-- Load from existing assets --</option>
                    </select>
                    <input type="file" id="watch-file-upload" accept="image/*">
                    <input type="text" id="watch-desc" placeholder="Status (e.g. Episode 4)...">
                </div>
            </div>

            <div class="section-box">
                <label>MODE OVERRIDE</label>
                <div class="mode-grid">
                    <button onclick="saveMode('default')">DEFAULT</button>
                    <button onclick="saveMode('busy')">BUSY</button>
                    <button onclick="saveMode('gaming')">GAMING</button>
                    <button onclick="saveMode('blogging')">BLOGGING</button>
                </div>
            </div>

            <div class="widget-section" style="border-left-color: #ff0055;">
                <label>📝 BLOG POST IMAGE (Optional)</label>
                <select id="blog-select" class="art-dropdown">
                    <option value="">-- Load from existing assets --</option>
                </select>
                <input type="file" id="blog-file-upload" accept="image/*">
            </div>

            <input type="text" id="title" placeholder="Broadcast Title...">
            <textarea id="content" placeholder="What's corrupting your mind?"></textarea>

            <button id="submit-btn" onclick="publishPost()">TRANSMIT TO CORE ⚡</button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'SugarHyou';
        const REPO_NAME = 'sugarhyperdose';
        const FILE_PATH = 'public/output/journal.json';
        const ART_ASSETS_PATH = 'public/assets/art';
        const CAMERA_ASSETS_PATH = 'public/assets/camera';

        function saveMode(mode) {
            localStorage.setItem('sugar_mode_request', mode);
            alert("Command Sent: " + mode.toUpperCase());
        }

        // Automatically populate dropdown menus with existing files from both art and camera folders
        async function initAdminPanel() {
            let GITHUB_TOKEN = localStorage.getItem('overdose_journal_token');
            if (!GITHUB_TOKEN) return; // Skip fetching if not authenticated yet

            try {
                // Fetch Art Assets
                const artRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${ART_ASSETS_PATH}`, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
                if (artRes.status === 200) {
                    let artFiles = await resJsonOrEmpty(artRes);
                    ['art-select', 'play-select', 'watch-select', 'blog-select'].forEach(id => {
                        let select = document.getElementById(id);
                        artFiles.forEach(file => {
                            if (file.type === 'file' && /\.(png|jpg|jpeg|gif|webp)$/i.test(file.name)) {
                                let opt = document.createElement('option');
                                opt.value = `assets/art/${file.name}`;
                                opt.innerText = `[Art] ${file.name}`;
                                select.appendChild(opt);
                            }
                        });
                    });
                }

                // Fetch Camera / Photo Assets
                const camRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${CAMERA_ASSETS_PATH}`, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
                if (camRes.status === 200) {
                    let camFiles = await resJsonOrEmpty(camRes);
                    // Add camera assets primarily to blog-select (and others if you want)
                    ['blog-select', 'art-select'].forEach(id => {
                        let select = document.getElementById(id);
                        camFiles.forEach(file => {
                            if (file.type === 'file' && /\.(png|jpg|jpeg|gif|webp)$/i.test(file.name)) {
                                let opt = document.createElement('option');
                                opt.value = `assets/camera/${file.name}`;
                                opt.innerText = `[Photo] ${file.name}`;
                                select.appendChild(opt);
                            }
                        });
                    });
                }
            } catch (e) {
                console.log("Could not pre-load asset folder lists automatically:", e);
            }
        }

        async function resJsonOrEmpty(res) {
            try { return await res.json(); } catch (err) { return []; }
        }

        // Helper to convert an uploaded file into base64 and push it to a specified GitHub folder path
        async function uploadFileToGithub(fileInputId, folderPath, token) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files || fileInput.files.length === 0) return null;

            const file = fileInput.files[0];
            const fileName = file.name.replace(/\s+/g, '-').toLowerCase();
            const targetPath = `${folderPath}/${fileName}`;
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${targetPath}`;

            const base64Content = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });

            let res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `Upload asset to ${folderPath} via Admin Console: ${fileName}`,
                    content: base64Content
                })
            });

            if (res.status === 200 || res.status === 201) {
                // Return relative public asset path matching the folder used
                const folderName = folderPath.split('/').pop();
                return `assets/${folderName}/${fileName}`;
            } else {
                throw new Error(`Failed to upload image file: ${fileName}`);
            }
        }

        async function publishPost() {
            let GITHUB_TOKEN = localStorage.getItem('overdose_journal_token');
            if (!GITHUB_TOKEN) {
                GITHUB_TOKEN = prompt("SYSTEM ACCESS REQUIRED:");
                if (GITHUB_TOKEN) {
                    localStorage.setItem('overdose_journal_token', GITHUB_TOKEN.trim());
                } else {
                    return;
                }
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "TRANSMITTING... ⚡";
            btn.disabled = true;

            try {
                // Upload normal widgets to assets/art, but blog uploads go to assets/camera!
                const uploadedArtImg = await uploadFileToGithub('art-file-upload', 'public/assets/art', GITHUB_TOKEN);
                const uploadedPlayImg = await uploadFileToGithub('play-file-upload', 'public/assets/art', GITHUB_TOKEN);
                const uploadedWatchImg = await uploadFileToGithub('watch-file-upload', 'public/assets/art', GITHUB_TOKEN);
                const uploadedBlogImg = await uploadFileToGithub('blog-file-upload', 'public/assets/camera', GITHUB_TOKEN);

                const title = document.getElementById('title').value;
                const content = document.getElementById('content').value;
                const targetStress = parseInt(document.getElementById('stat-stress').value);
                const targetAffection = parseInt(document.getElementById('stat-affection').value);

                const artImageFinal = uploadedArtImg || document.getElementById('art-select').value;
                const playImageFinal = uploadedPlayImg || document.getElementById('play-select').value;
                const watchImageFinal = uploadedWatchImg || document.getElementById('watch-select').value;
                const blogImageFinal = uploadedBlogImg || document.getElementById('blog-select').value;

                const artTitle = document.getElementById('art-title').value;
                const artDesc = document.getElementById('art-desc').value;

                const playTitle = document.getElementById('play-title').value;
                const playDesc = document.getElementById('play-desc').value;

                const watchTitle = document.getElementById('watch-title').value;
                const watchDesc = document.getElementById('watch-desc').value;

                const now = new Date();
                const formattedDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' - ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
                let res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
                let sha = undefined;
                let dbStructure = {
                    currentStats: { stress: targetStress, affection: targetAffection },
                    art: { title: "", image: "", desc: "" },
                    playing: { title: "", image: "", desc: "" },
                    watching: { title: "", image: "", desc: "" },
                    posts: []
                };

                if (res.status === 200) {
                    const fileData = await res.json();
                    sha = fileData.sha;
                    try {
                        dbStructure = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, '')))));
                    } catch (e) {
                        console.warn("Existing file was empty or malformed, resetting structure.");
                    }
                }

                if (!dbStructure.currentStats) dbStructure.currentStats = {};
                dbStructure.currentStats.stress = targetStress;
                dbStructure.currentStats.affection = targetAffection;

                if (!dbStructure.art) dbStructure.art = {};
                if (artTitle || artImageFinal || artDesc) {
                    dbStructure.art.title = artTitle || dbStructure.art.title || "";
                    if (artImageFinal) dbStructure.art.image = artImageFinal;
                    dbStructure.art.desc = artDesc || dbStructure.art.desc || "";
                }

                if (!dbStructure.playing) dbStructure.playing = {};
                if (playTitle || playImageFinal || playDesc) {
                    dbStructure.playing.title = playTitle || dbStructure.playing.title || "";
                    if (playImageFinal) dbStructure.playing.image = playImageFinal;
                    dbStructure.playing.desc = playDesc || dbStructure.playing.desc || "";
                }

                if (!dbStructure.watching) dbStructure.watching = {};
                if (watchTitle || watchImageFinal || watchDesc) {
                    dbStructure.watching.title = watchTitle || dbStructure.watching.title || "";
                    if (watchImageFinal) dbStructure.watching.image = watchImageFinal;
                    dbStructure.watching.desc = watchDesc || dbStructure.watching.desc || "";
                }

                if (content.trim() !== "") {
                    if (!dbStructure.posts) dbStructure.posts = [];
                    dbStructure.posts.unshift({
                        date: formattedDate,
                        title: title || "Untitled",
                        content: content,
                        image: blogImageFinal || ""
                    });
                }

                const bodyPayload = {
                    message: `📈 Update Dashboard, Assets & Widgets via Admin Panel`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(dbStructure, null, 2))))
                };

                if (sha) {
                    bodyPayload.sha = sha;
                }

                let updateRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyPayload)
                });

                if (updateRes.status === 200 || updateRes.status === 201) {
                    alert("TRANSMITTED SUCCESSFULLY! 🎀");
                    document.getElementById('title').value = '';
                    document.getElementById('content').value = '';
                    document.getElementById('art-file-upload').value = '';
                    document.getElementById('play-file-upload').value = '';
                    document.getElementById('watch-file-upload').value = '';
                    document.getElementById('blog-file-upload').value = '';
                } else {
                    const errData = await updateRes.json();
                    alert("Error writing to core: " + (errData.message || updateRes.status));
                }
            } catch (error) {
                alert(`Terminal Error: ${error.message}`);
            } finally {
                btn.innerText = "TRANSMIT TO CORE ⚡";
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
