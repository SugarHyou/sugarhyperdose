<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ADMIN PANEL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dash-container {
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .window-title {
            padding: 8px;
            font-weight: 900;
        }

        .window-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
        }

        .section-box {
            padding: 10px;
            background: #f9f9f9;
        }

        label {
            display: block;
            font-weight: 900;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }

        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #ff0055;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        button {
            cursor: pointer;
            border: 2px outset #fff;
            background: #eee;
            font-weight: bold;
            padding: 8px;
        }

        button:hover {
            background: #ddd;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        #submit-btn {
            background: blueviolet;
            color: white;
            font-weight: 900;
            padding: 10px;
            cursor: pointer;
        }

        .widget-section {
            border-left: 4px solid blueviolet;
            padding-left: 8px;
            margin-top: 8px;
        }
    </style>
</head>

<body class="flex justify-center align-center">

    <div class="window dash-container">
        <div class="window-title">admin.exe</div>
        <div class="window-body">

            <div class="section-box">
                <label style="color: red;">STRESS</label>
                <div class="slider-wrap">
                    <input type="range" id="stat-stress" min="0" max="100" value="20"
                        oninput="document.getElementById('val-stress').innerText = this.value + '%'">
                    <span id="val-stress">20%</span>
                </div>
            </div>

            <div class="section-box">
                <label style="color: hotpink;">AFFECTION</label>
                <div class="slider-wrap">
                    <input type="range" id="stat-affection" min="0" max="100" value="50"
                        oninput="document.getElementById('val-affection').innerText = this.value + '%'">
                    <span id="val-affection">50%</span>
                </div>
            </div>

            <!-- Widget Updaters -->
            <div class="section-box">
                <div class="widget-section">
                    <label>🎨 LATEST ART</label>
                    <input type="text" id="art-title" placeholder="Art Title...">
                    <input type="text" id="art-image" placeholder="Image Path (e.g. assets/art/...)">
                    <input type="text" id="art-desc" placeholder="Art Short Description...">
                </div>

                <div class="widget-section" style="border-left-color: dodgerblue;">
                    <label>🎮 PLAYING</label>
                    <input type="text" id="play-title" placeholder="Game Name...">
                    <input type="text" id="play-image" placeholder="Game Icon Path...">
                    <input type="text" id="play-desc" placeholder="Status (e.g. Grinding levels)...">
                </div>

                <div class="widget-section" style="border-left-color: limegreen;">
                    <label>📺 WATCHING</label>
                    <input type="text" id="watch-title" placeholder="Show Name...">
                    <input type="text" id="watch-image" placeholder="Show Icon Path...">
                    <input type="text" id="watch-desc" placeholder="Status (e.g. Episode 4)...">
                </div>
            </div>

            <div class="section-box">
                <label>MODE OVERRIDE</label>
                <div class="mode-grid">
                    <button onclick="saveMode('default')">DEFAULT</button>
                    <button onclick="saveMode('busy')">BUSY</button>
                    <button onclick="saveMode('gaming')">GAMING</button>
                    <button onclick="saveMode('blogging')">BLOGGING</button>
                    <button onclick="saveMode('andy')" style="background: #333; color: #fff;">...</button>
                </div>
            </div>

            <input type="text" id="title" placeholder="Broadcast Title...">
            <textarea id="content" placeholder="What's corrupting your mind?"></textarea>

            <button id="submit-btn" onclick="publishPost()">TRANSMIT TO CORE ⚡</button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'SugarHyou';
        const REPO_NAME = 'sugarhyperdose';
        const FILE_PATH = 'public/output/journal.json';

        function saveMode(mode) {
            localStorage.setItem('sugar_mode_request', mode);
            alert("Command Sent: " + mode.toUpperCase());
        }

        async function publishPost() {
            let GITHUB_TOKEN = localStorage.getItem('overdose_journal_token');
            if (!GITHUB_TOKEN) {
                GITHUB_TOKEN = prompt("SYSTEM ACCESS REQUIRED:");
                if (GITHUB_TOKEN) localStorage.setItem('overdose_journal_token', GITHUB_TOKEN.trim());
                else return;
            }

            const btn = document.getElementById('submit-btn');
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const targetStress = parseInt(document.getElementById('stat-stress').value);
            const targetAffection = parseInt(document.getElementById('stat-affection').value);

            const artTitle = document.getElementById('art-title').value;
            const artImage = document.getElementById('art-image').value;
            const artDesc = document.getElementById('art-desc').value;

            const playTitle = document.getElementById('play-title').value;
            const playImage = document.getElementById('play-image').value;
            const playDesc = document.getElementById('play-desc').value;

            const watchTitle = document.getElementById('watch-title').value;
            const watchImage = document.getElementById('watch-image').value;
            const watchDesc = document.getElementById('watch-desc').value;

            btn.innerText = "TRANSMITTING... ⚡";
            btn.disabled = true;

            const now = new Date();
            const formattedDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' - ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            try {
                const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
                let res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
                let sha = undefined;
                let dbStructure = {
                    currentStats: { stress: targetStress, affection: targetAffection },
                    art: { title: "", image: "", desc: "" },
                    playing: { title: "", image: "", desc: "" },
                    watching: { title: "", image: "", desc: "" },
                    posts: []
                };

                if (res.status === 200) {
                    const fileData = await res.json();
                    sha = fileData.sha;
                    try {
                        dbStructure = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, '')))));
                    } catch (e) {
                        console.warn("Existing file was empty or malformed, resetting structure.");
                    }
                }

                // Ensure structural safety
                if (!dbStructure.currentStats) dbStructure.currentStats = {};
                dbStructure.currentStats.stress = targetStress;
                dbStructure.currentStats.affection = targetAffection;

                if (!dbStructure.art) dbStructure.art = {};
                if (artTitle || artImage || artDesc) {
                    dbStructure.art.title = artTitle || dbStructure.art.title || "";
                    dbStructure.art.image = artImage || dbStructure.art.image || "";
                    dbStructure.art.desc = artDesc || dbStructure.art.desc || "";
                }

                if (!dbStructure.playing) dbStructure.playing = {};
                if (playTitle || playImage || playDesc) {
                    dbStructure.playing.title = playTitle || dbStructure.playing.title || "";
                    dbStructure.playing.image = playImage || dbStructure.playing.image || "";
                    dbStructure.playing.desc = playDesc || dbStructure.playing.desc || "";
                }

                if (!dbStructure.watching) dbStructure.watching = {};
                if (watchTitle || watchImage || watchDesc) {
                    dbStructure.watching.title = watchTitle || dbStructure.watching.title || "";
                    dbStructure.watching.image = watchImage || dbStructure.watching.image || "";
                    dbStructure.watching.desc = watchDesc || dbStructure.watching.desc || "";
                }

                if (content.trim() !== "") {
                    if (!dbStructure.posts) dbStructure.posts = [];
                    dbStructure.posts.unshift({ date: formattedDate, title: title || "Untitled", content: content });
                }

                const bodyPayload = {
                    message: `📈 Update Dashboard & Widgets via Admin Panel`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(dbStructure, null, 2))))
                };

                if (sha) {
                    bodyPayload.sha = sha;
                }

                let updateRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyPayload)
                });

                if (updateRes.status === 200 || updateRes.status === 201) {
                    alert("TRANSMITTED SUCCESSFULLY! 🎀");
                    document.getElementById('title').value = '';
                    document.getElementById('content').value = '';
                } else {
                    const errData = await updateRes.json();
                    alert("Error writing to core: " + (errData.message || updateRes.status));
                }
            } catch (error) {
                alert(`Terminal Error: ${error.message}`);
            } finally {
                btn.innerText = "TRANSMIT TO CORE ⚡";
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
